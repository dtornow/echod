roots = [
  "Resonate",
  "Protocol",
  "abstract.Machine",
  "abstract.External",
  "abstract.Internal",
  "abstract.System",
  "abstract.Model",
  "concrete.Model",
  "concrete.Refinement",
  "Check",
  "Examples",
]
