[package]
name = "echod-server"
description = "A Resonate server over an S3 bucket: the verified kernel, one document per origin, nodes that find each other in the bucket."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "echod-server"
path = "src/main.rs"

[lib]
name = "echod_server"
path = "src/lib.rs"

[dependencies]
echod-kernel = { path = "../echod-kernel" }
echod-fleet = { path = "../echod-fleet" }
resonate-core = { git = "https://github.com/resonatehq/resonate", rev = "28dfd016aa970332dc283e2431c406845e2ccc8f" }
async-trait = "0.1"
axum = { version = "0.7", features = ["json"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
validator = { version = "0.18", features = ["derive"] }

[dev-dependencies]
