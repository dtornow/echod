[package]
name = "echod-abstract"
description = "Independent executable Verus port of the Resonate Lean abstract machine."
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "echod_abstract"
path = "src/lib.rs"

[dependencies]
vstd = "=0.0.0-2026-10-11-0230"
verus_builtin = "=0.0.0-2026-10-11-0230"
verus_builtin_macros = "=0.0.0-2026-09-20-0158"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_verify_core)'] }
