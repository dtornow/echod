[package]
name = "echod-process"
description = "The decision core of echod: a pure state machine from events to effects, no I/O, no clock, no runtime. The proved document machine is src/verified."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "echod_logic"
path = "src/lib.rs"

# Verus is not needed to build this crate: `verus_builtin_macros` erases every
# spec, proof, requires and ensures under plain rustc. `./verify.sh` verifies
# src/verified/mod.rs, not this crate's other modules.
[dependencies]
echod-concrete = { path = "../../spec/concrete" }
vstd = "=0.0.0-2026-10-11-0230"
verus_builtin = "=0.0.0-2026-10-11-0230"
verus_builtin_macros = "=0.0.0-2026-09-20-0158"
chrono = "0.4"
cron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_verify_core)'] }
