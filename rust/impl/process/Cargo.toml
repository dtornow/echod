[package]
name = "echod-process"
description = "The decision core of echod: the executable concrete document machine and a pure state machine from events to effects."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "echod_logic"
path = "src/lib.rs"

# Verus is not needed to build this crate: `verus_builtin_macros` erases every
# spec, proof, requires and ensures under plain rustc. `cargo verus verify`
# checks the whole crate: `State::on_event` computes `spec_on_event`.
[dependencies]
echod-abstract = { package = "echod-abstract-spec", path = "../../spec/abstract" }
echod-concrete = { package = "echod-concrete-spec", path = "../../spec/concrete" }
echod-cron = { path = "../../comm/cron" }
echod-rover = { package = "echod-rover-spec", path = "../../spec/rover" }
echod-types = { path = "../../comm/types" }
vstd = "=0.0.0-2026-10-11-0230"
verus_builtin = "=0.0.0-2026-10-11-0230"
verus_builtin_macros = "=0.0.0-2026-09-20-0158"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
echod-rover-exec = { path = "../../spec/rover-exec" }

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_verify_core)'] }
