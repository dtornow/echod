[package]
name = "echod-box"
description = "An ephemeral Docker development box with optional Nix setup."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "box"
path = "src/main.rs"

[features]
default = []
strands-proxy = ["dep:strands-box-egress-gateway"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
strands-box-egress-gateway = { path = "vendor/strands-box/egress-gateway", optional = true }
