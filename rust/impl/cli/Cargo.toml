[package]
name = "echod"
description = "The echod binary."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "echod"
path = "src/main.rs"

[dependencies]
echod-runtime = { path = "../runtime" }
clap = { version = "4", features = ["derive", "env"] }
resonate-core = { git = "https://github.com/resonatehq/resonate", rev = "28dfd016aa970332dc283e2431c406845e2ccc8f" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
