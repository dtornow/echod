[package]
name = "echod-test-runtime"
description = "Synchronous deterministic effect interpreter for echod: one seed, a virtual clock, an in-memory store, and recorded sends."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "echod_sim"
path = "src/lib.rs"

[dependencies]
echod-process = { path = "../../impl/process" }
echod-cron = { path = "../../comm/cron" }
echod-types = { path = "../../comm/types" }
serde = { version = "1", features = ["derive"] }
echod-rover-exec = { path = "../../spec/rover-exec" }
rover-abstract-spec = { package = "echod-rover-abstract-spec", path = "../../spec/abstract" }
rover-abstract-exec = { package = "echod-rover-abstract-exec", path = "../../spec/abstract-exec" }

[dev-dependencies]
serde_json = "1"
