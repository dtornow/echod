[package]
name = "echod-chaos"
description = "echod as deployed, under real faults: nodes as processes in containers over fakes3, crashed, paused, partitioned and slowed while clients drive the protocol; then what the clients saw and the bucket holds, checked."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "chaos-agent"
path = "src/agent.rs"

[[bin]]
name = "echod-chaos"
path = "src/main.rs"

[dependencies]
echod = { package = "echod-runtime", path = "../../../impl/runtime" }
echod-types = { path = "../../../comm/types" }
echod-process = { path = "../../../impl/process" }
echod-sim = { package = "echod-test-runtime", path = "../../runtime" }
axum = { version = "0.7", features = ["json"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
resonate-core = { git = "https://github.com/resonatehq/resonate", rev = "28dfd016aa970332dc283e2431c406845e2ccc8f" }
