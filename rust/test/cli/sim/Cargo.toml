[package]
name = "echod-sim"
description = "The echod simulator: one seeded run, or a soak, over the deterministic interpreter."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "echod-sim"
path = "src/main.rs"

[dependencies]
echod-test-runtime = { path = "../../runtime" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
