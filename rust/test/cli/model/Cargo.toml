[package]
name = "echod-model"
description = "echod driven over HTTP by the Resonate model, every recorded trace checked against it."
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "echod-model"
path = "src/main.rs"

[dependencies]
echod-rover = { package = "echod-rover-spec", path = "../../../spec/rover" }
echod-rover-exec = { path = "../../../spec/rover-exec" }
echod-abstract = { package = "echod-abstract-spec", path = "../../../spec/abstract" }
echod-abstract-exec = { path = "../../../spec/abstract-exec" }
resonate-core = { git = "https://github.com/resonatehq/resonate", rev = "28dfd016aa970332dc283e2431c406845e2ccc8f" }
axum = { version = "0.7", features = ["json"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
