[package]
name = "echod-store-tests"
description = "Store contract tests and end-to-end tests of the echod runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
echod = { package = "echod-runtime", path = "../../../impl/runtime" }
echod-process = { path = "../../../impl/process" }
resonate-core = { git = "https://github.com/resonatehq/resonate", rev = "28dfd016aa970332dc283e2431c406845e2ccc8f" }
axum = { version = "0.7", features = ["json"] }
object_store = { version = "0.14", features = ["aws", "gcp", "azure"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
