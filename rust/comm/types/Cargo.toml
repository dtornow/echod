[package]
name = "echod-types"
description = "The types spec and implementation share: records, requests, and responses."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "echod_types"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
vstd = "=0.0.0-2026-10-11-0230"
verus_builtin = "=0.0.0-2026-10-11-0230"
verus_builtin_macros = "=0.0.0-2026-09-20-0158"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_verify_core)'] }
