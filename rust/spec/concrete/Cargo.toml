[package]
name = "echod-concrete-spec"
description = "The mathematical concrete Rover model and its refinement to the abstract specification."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "echod_concrete"
path = "src/lib.rs"

[dependencies]
echod-types = { path = "../../comm/types" }
echod-rover = { package = "echod-rover-spec", path = "../rover" }
echod-abstract = { package = "echod-abstract-spec", path = "../abstract" }
vstd = "=0.0.0-2026-10-11-0230"
verus_builtin = "=0.0.0-2026-10-11-0230"
verus_builtin_macros = "=0.0.0-2026-09-20-0158"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_verify_core)'] }
