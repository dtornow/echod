[package]
name = "echod-world"
description = "The Rover world: the nodes and one store, on the process's store calls."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "echod_world"
path = "src/lib.rs"

[dependencies]
echod-process = { path = "../../impl/process" }
echod-rover = { path = "../rover" }
resonate = { package = "echod-abstract", path = "../abstract" }
vstd = "=0.0.0-2026-10-11-0230"
verus_builtin = "=0.0.0-2026-10-11-0230"
verus_builtin_macros = "=0.0.0-2026-09-20-0158"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_verify_core)'] }
