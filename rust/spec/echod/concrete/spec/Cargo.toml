[package]
name = "echod-concrete-spec"
description = "The mathematical Echod concrete model."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "echod_concrete_spec"
path = "src/lib.rs"

[dependencies]
echod-types = { path = "../../../../comm/types" }
rover-spec = { path = "../../../rover/spec" }
# The concrete Rover boundary uses the protocol's Call/Output/Dispatch types,
# and schedule transitions share the protocol's trusted cron/expansion algebra.
echod-abstract-spec = { path = "../../abstract/spec" }
vstd = "=0.0.0-2026-10-11-0230"
verus_builtin = "=0.0.0-2026-10-11-0230"
verus_builtin_macros = "=0.0.0-2026-09-20-0158"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_verify_core)'] }
