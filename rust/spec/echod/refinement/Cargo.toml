[package]
name = "echod-refinement"
description = "Verified refinement from the Echod concrete model to the abstract specification."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "echod_refinement"
path = "src/refinement_claim.rs"

[dependencies]
echod-types = { path = "../../../comm/types" }
rover-spec = { path = "../../rover/spec" }
echod-abstract-spec = { path = "../abstract/spec" }
echod-concrete-spec = { path = "../concrete/spec" }
vstd = "=0.0.0-2026-10-11-0230"
verus_builtin = "=0.0.0-2026-10-11-0230"
verus_builtin_macros = "=0.0.0-2026-09-20-0158"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_verify_core)'] }
