[package]
name = "echod-abstract"
description = "The Resonate protocol as a Rover model: executable handlers, their specification twins, and the one-process reference."
version.workspace = true
edition.workspace = true
license = "MIT"

[lib]
name = "resonate"
path = "src/lib.rs"

[dependencies]
echod-types = { path = "../../comm/types" }
echod-cron = { path = "../../comm/cron" }
echod-rover = { path = "../rover" }
vstd = "=0.0.0-2026-10-11-0230"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)'] }
