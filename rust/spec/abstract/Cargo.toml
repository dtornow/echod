[package]
name = "echod-rover-abstract-spec"
description = "The mathematical Resonate protocol specification and verified transition kernel."
version.workspace = true
edition.workspace = true
license = "MIT"

[lib]
name = "rover_abstract_spec"
path = "src/lib.rs"

[dependencies]
echod-types = { path = "../../comm/types" }
echod-rover = { package = "echod-rover-spec", path = "../rover" }
