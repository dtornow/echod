[package]
name = "rover-exec"
description = "Executable search and verified replay for Rover specifications."
version.workspace = true
edition.workspace = true
license = "MIT"

[lib]
name = "rover_exec"
path = "src/lib.rs"

[dependencies]
rover-spec = { path = "../spec" }
vstd = "=0.0.0-2026-10-11-0230"

[dev-dependencies]
echod-abstract-spec = { path = "../../echod/abstract/spec" }
echod-abstract-exec = { path = "../../echod/abstract/exec" }

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)'] }
