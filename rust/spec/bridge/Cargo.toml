[package]
name = "echod-bridge"
description = "The document the process is proved against, read as the concrete Rover model's document: the request handlers agree."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "echod_bridge"
path = "src/lib.rs"

[dependencies]
echod-types = { path = "../../comm/types" }
echod-document = { path = "../../impl/document" }
echod-abstract = { path = "../abstract" }
echod-concrete = { path = "../concrete" }
vstd = "=0.0.0-2026-10-11-0230"
verus_builtin = "=0.0.0-2026-10-11-0230"
verus_builtin_macros = "=0.0.0-2026-09-20-0158"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_verify_core)'] }
