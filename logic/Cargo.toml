[package]
name = "echod-logic"
description = "The decision core of echod: a pure state machine from events to effects, no I/O, no clock, no runtime."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "echod_logic"
path = "src/lib.rs"

[dependencies]
echod-kernel = { path = "../kernel" }
resonate-core = { git = "https://github.com/resonatehq/resonate", rev = "28dfd016aa970332dc283e2431c406845e2ccc8f" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.18", features = ["derive"] }
