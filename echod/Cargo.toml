[package]
name = "echod"
description = "The echod node: the decision core run against a real store, a real clock and HTTP; the binary."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "echod"
path = "src/main.rs"

[lib]
name = "echod"
path = "src/lib.rs"

[dependencies]
echod-kernel = { path = "../kernel" }
echod-fleet = { path = "../fleet" }
echod-logic = { path = "../logic" }
resonate-core = { git = "https://github.com/resonatehq/resonate", rev = "28dfd016aa970332dc283e2431c406845e2ccc8f" }
async-trait = "0.1"
axum = { version = "0.7", features = ["json"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
clap = { version = "4", features = ["derive", "env"] }
object_store = { version = "0.14", features = ["aws", "gcp", "azure"] }
url = "2"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus-client = "0.25"

[dev-dependencies]
