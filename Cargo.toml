[workspace]
resolver = "2"
members = [
  "rust/impl/process",
  "rust/impl/runtime",
  "rust/impl/cli",
  "rust/spec/rover/spec",
  "rust/spec/rover/exec",
  "rust/comm/types",
  "rust/comm/cron",
  "rust/spec/echod/abstract/spec",
  "rust/spec/echod/abstract/exec",
  "rust/spec/echod/concrete/spec",
  "rust/spec/echod/refinement",
  "rust/test/model",
  "rust/test/runtime",
  "rust/test/cli/sim",
  "rust/test/cli/diff",
  "rust/test/cli/model",
  "rust/test/cli/store",
  "rust/test/cli/fakes3",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
