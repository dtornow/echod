[package]
name = "accordant"
version = "0.1.0"
edition = "2021"
description = "Executable behavioral specifications: a Rust take on Microsoft Accordant's model, with split request/response and bounded eventually"
license = "MIT"

[dependencies]
chrono = "0.4.45"
cron = "0.17.0"
imbl = "7.0.2"
vstd = "=0.0.0-2026-10-11-0230"

[package.metadata.verus]
verify = true

[workspace]
members = [".", "examples/resonate", "examples/tigerbeetle"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)'] }
