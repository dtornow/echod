[package]
name = "echod-sim"
description = "Deterministic simulation of echod: one seed, no wall clock, no sockets; every run checked against the Resonate model of dtornow/accordant."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "echod-sim"
path = "src/main.rs"

[lib]
name = "echod_sim"
path = "src/lib.rs"

[dependencies]
echod-kernel = { path = "../kernel" }
echod-logic = { path = "../logic" }
echod = { path = "../echod" }
resonate-core = { git = "https://github.com/resonatehq/resonate", rev = "28dfd016aa970332dc283e2431c406845e2ccc8f" }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "macros", "sync", "test-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
accordant = { git = "https://github.com/dtornow/accordant", rev = "609f8c00ca6d1105a6c0e1de9ae014c63bae3e8c" }
resonate = { git = "https://github.com/dtornow/accordant", rev = "609f8c00ca6d1105a6c0e1de9ae014c63bae3e8c", package = "resonate" }
