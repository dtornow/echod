name: soak

on:
  push:
  pull_request:

jobs:
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 20 seeds, 1000 operations each
        run: cargo run --release --locked -p echod-sim -- soak --from 1 --seeds 20 --operations 1000
